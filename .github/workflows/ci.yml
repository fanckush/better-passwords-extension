name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test:coverage
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1
      - run: bun run build
      - run: bun run --filter @app/extension lint:firefox
      - name: Check the macOS setup script
        run: |
          sh -n scripts/setup-mac.sh
          shellcheck scripts/setup-mac.sh
      - name: Check the Windows setup script
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/setup-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          $issues = Invoke-ScriptAnalyzer -Path scripts/setup-windows.ps1 -Severity Error, Warning -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) { $issues | Format-Table -AutoSize | Out-String | Write-Host; exit 1 }

  # runs no repository code: it only turns the summary into the README badge
  coverage-badge:
    name: Publish the coverage badge
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # force-pushes the badges branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
      - name: Push coverage.json to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          mkdir badges
          jq '.total.lines.pct | {
            schemaVersion: 1,
            label: "coverage",
            message: "\(floor)%",
            color: (if . >= 80 then "brightgreen" elif . >= 60 then "yellow" elif . >= 40 then "orange" else "red" end)
          }' coverage-summary.json > badges/coverage.json
          cd badges
          git init -q -b badges
          git add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: update coverage badge"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" badges

  e2e:
    name: End-to-end (Chromium + fake helper)
    # the extension offers its setup only on macOS, where Apple Passwords is
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: apps/extension
      - run: bun run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/extension/test-results
          retention-days: 7

  companion:
    name: Companion app (Swift)
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict --recursive Sources Tests Package.swift scripts
      - run: swift build
      - run: swift test
      - name: Bundle (ad hoc signed)
        run: |
          sh -n scripts/bundle.sh
          scripts/bundle.sh
