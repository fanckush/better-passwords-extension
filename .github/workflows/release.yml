name: Release

on:
  push:
    # v2: betas of the next major version, as GitHub pre-releases only
    branches: [main, v2]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  extension:
    name: Release the extension
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and GitHub releases
      issues: write # release comments on fixed issues
      pull-requests: write
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # these jobs hold release secrets: no dependency's install script runs here
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: release
        working-directory: apps/extension
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/extension/.output/*.zip
      # Store uploads stay off until the repository variable STORE_SUBMIT is true, and betas never go.
      - if: steps.release.outputs.version != '' && vars.STORE_SUBMIT == 'true' && github.ref == 'refs/heads/main'
        working-directory: apps/extension
        run: >
          bunx wxt submit
          --chrome-zip .output/store/better-passwords-*-chrome.zip
          --firefox-zip .output/better-passwords-*-firefox.zip
          --firefox-sources-zip .output/better-passwords-*-sources.zip
        env:
          CHROME_API_VERSION: v2
          CHROME_EXTENSION_ID: ocongmkplhijgajnipnhhggfcjfdilgj
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_DEPLOY_PERCENTAGE: 100
          CHROME_CANCEL_PENDING: true
          FIREFOX_EXTENSION_ID: better-passwords
          FIREFOX_CHANNEL: listed
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

  companion:
    name: Release the companion app
    # Off until Developer ID signing and notarization secrets exist (see docs/release.md); from main only.
    if: vars.COMPANION_RELEASE == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    # a hang fails fast instead of holding the release queue for GitHub's 6-hour limit
    timeout-minutes: 60
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      # these jobs hold release secrets: no dependency's install script runs here
      - run: bun install --frozen-lockfile --ignore-scripts
      # SwiftPM looks up download credentials in the keychain, and that lookup hangs once the
      # signing keychain is in the search list, so fetch Sparkle (and its binary) before it is
      - run: swift package resolve
        working-directory: apps/companion
      - name: Import the signing certificate and notary key
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - id: release
        working-directory: apps/companion
        run: ../../node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      - if: steps.release.outputs.version != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/companion/dist/updates/*.dmg
      - if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
