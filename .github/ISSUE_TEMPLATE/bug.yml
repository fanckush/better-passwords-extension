name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste passwords, pairing codes or screenshots showing them.**
        Security problems go through [private reporting](../security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open https://example.com/login\n2. Click the extension icon\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Browser store installation
        - GitHub download (loaded unpacked, with the same one-time setup)
        - Built from source
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Helium 0.19, Firefox 145…
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS or Windows version
      placeholder: "macOS 27.0.1, Windows 11…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the browser's extensions page.
