name: Password manager support
description: Ask for a password manager Better Passwords doesn't fill from yet
title: "Support <password manager name>"
labels: [enhancement]
body:
  - type: input
    id: manager
    attributes:
      label: Password manager
      description: Its name and a link to its website.
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: How you use it
      description: Which plan, a hosted or your own server, and what you'd want to fill. Never include passwords.
